<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Closebuy – offline</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f5f5db; color: #1f1a14; text-align: center; padding: 24px; box-sizing: border-box; }
    @media (prefers-color-scheme: dark) { body { background: #0b0f17; color: #eef0f4; } p { color: #a9b0bd; } }
    .card { max-width: 340px; }
    img { width: 72px; height: auto; margin-bottom: 16px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: #6b6458; line-height: 1.5; }
    button { background: #ff8f66; color: #fff; border: 0; border-radius: 12px; padding: 14px 28px; font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <img src="logo.png" alt="" />
    <h1>You’re offline</h1>
    <p>Closebuy needs an internet connection. Check your data or Wi‑Fi, then try again.</p>
    <button onclick="location.href='https://cbuyapp.com/shop'">Try again</button>
  </div>
</body>
</html>
