# Fly.io settings for Closebuy. See DEPLOY.md for the one-time setup.
# Change `app` if the name is taken. `primary_region` "lhr" is London; see
# `fly platform regions` for others (e.g. "jnb" Johannesburg if available).
app = "closebuy"
primary_region = "lhr"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATABASE_URL = "/data/closebuy.db"
  UPLOAD_DIR = "/data/uploads"

[http_service]
  internal_port = 3000
  force_https = true
  # Always one machine running: the SQLite database lives on its disk, so there must be exactly one.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[mounts]]
  source = "closebuy_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
