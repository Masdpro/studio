<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img" aria-labelledby="t">
  <title id="t">A Closebuy rider delivering a package from a row of neighbourhood shops to a customer holding a phone</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4D6"/>
      <stop offset="1" stop-color="#FCE9C4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" rx="28" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="660" cy="96" r="46" fill="#FFD36B"/>
  <!-- distant buildings -->
  <g fill="#F6D9B3">
    <rect x="40" y="120" width="90" height="210" rx="6"/>
    <rect x="140" y="80" width="70" height="250" rx="6"/>
    <rect x="560" y="140" width="80" height="190" rx="6"/>
    <rect x="650" y="170" width="110" height="160" rx="6"/>
  </g>
  <g fill="#FFF7E8">
    <rect x="58" y="140" width="18" height="18" rx="3"/><rect x="94" y="140" width="18" height="18" rx="3"/>
    <rect x="58" y="176" width="18" height="18" rx="3"/><rect x="94" y="176" width="18" height="18" rx="3"/>
    <rect x="156" y="100" width="16" height="16" rx="3"/><rect x="182" y="100" width="16" height="16" rx="3"/>
    <rect x="156" y="132" width="16" height="16" rx="3"/><rect x="182" y="132" width="16" height="16" rx="3"/>
    <rect x="580" y="160" width="16" height="16" rx="3"/><rect x="608" y="160" width="16" height="16" rx="3"/>
    <rect x="670" y="190" width="18" height="18" rx="3"/><rect x="704" y="190" width="18" height="18" rx="3"/><rect x="738" y="190" width="12" height="18" rx="3"/>
  </g>
  <!-- market stalls -->
  <g>
    <rect x="70" y="230" width="190" height="130" rx="8" fill="#FFFFFF"/>
    <path d="M60 230 h210 l-10 -48 h-190 z" fill="#FF8F66"/>
    <path d="M70 182 h38 l-6 48 h-42 z M146 182 h38 l2 48 h-42 z M222 182 h38 l10 48 h-42 z" fill="#FFB596"/>
    <rect x="86" y="262" width="158" height="12" rx="6" fill="#E9D9BF"/>
    <circle cx="104" cy="252" r="12" fill="#F4A340"/><circle cx="128" cy="254" r="10" fill="#7BB661"/><circle cx="150" cy="252" r="12" fill="#E2574C"/>
    <rect x="176" y="238" width="22" height="24" rx="4" fill="#F4C542"/><rect x="204" y="242" width="26" height="20" rx="4" fill="#9A6B4F"/>
    <rect x="96" y="290" width="54" height="70" rx="6" fill="#FCE9C4"/>
    <rect x="166" y="290" width="62" height="40" rx="6" fill="#FFF4D6" stroke="#F6D9B3" stroke-width="3"/>

    <rect x="290" y="250" width="170" height="110" rx="8" fill="#FFFFFF"/>
    <path d="M280 250 h190 l-10 -44 h-170 z" fill="#ECDA6E"/>
    <path d="M290 206 h34 l-6 44 h-38 z M358 206 h34 l2 44 h-38 z M426 206 h34 l10 44 h-38 z" fill="#F6EBA6"/>
    <rect x="304" y="270" width="140" height="10" rx="5" fill="#E9D9BF"/>
    <path d="M314 270 l10 -24 l10 24 z" fill="#2E9C8F"/><path d="M340 270 l10 -26 l10 26 z" fill="#FF8F66"/><path d="M366 270 l10 -22 l10 22 z" fill="#5B6DC9"/>
    <rect x="396" y="246" width="40" height="24" rx="5" fill="#C58BD8"/>
    <rect x="312" y="296" width="124" height="64" rx="6" fill="#FCE9C4"/>
  </g>
  <!-- road -->
  <rect x="0" y="360" width="800" height="200" fill="#E8D3B0"/>
  <rect x="0" y="360" width="800" height="14" fill="#D9BF96"/>
  <g fill="#F7EBD6"><rect x="40" y="452" width="80" height="10" rx="5"/><rect x="200" y="452" width="80" height="10" rx="5"/><rect x="360" y="452" width="80" height="10" rx="5"/><rect x="520" y="452" width="80" height="10" rx="5"/><rect x="680" y="452" width="80" height="10" rx="5"/></g>
  <!-- dotted route from shop to customer -->
  <path d="M210 396 C 330 360, 470 420, 640 380" fill="none" stroke="#FF8F66" stroke-width="5" stroke-dasharray="2 14" stroke-linecap="round"/>
  <!-- location pin over customer -->
  <g transform="translate(676 210)">
    <path d="M0 -38 a26 26 0 0 1 26 26 c0 20 -26 46 -26 46 s-26 -26 -26 -46 a26 26 0 0 1 26 -26 z" fill="#FF8F66"/>
    <circle cx="0" cy="-12" r="10" fill="#FFFFFF"/>
  </g>
  <!-- rider on scooter -->
  <g transform="translate(330 330)">
    <ellipse cx="80" cy="112" rx="110" ry="10" fill="#D9BF96"/>
    <circle cx="20" cy="88" r="26" fill="#3D3A36"/><circle cx="20" cy="88" r="11" fill="#BDB6AC"/>
    <circle cx="150" cy="88" r="26" fill="#3D3A36"/><circle cx="150" cy="88" r="11" fill="#BDB6AC"/>
    <path d="M0 76 q10 -40 60 -40 h40 q30 0 44 26 l10 18 h-40 l-8 -14 h-56 q-24 0 -30 20 z" fill="#FF8F66"/>
    <path d="M138 36 l18 -40 h14" fill="none" stroke="#3D3A36" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- delivery box -->
    <rect x="-6" y="-14" width="58" height="50" rx="7" fill="#F4C542"/>
    <rect x="-6" y="-14" width="58" height="12" rx="6" fill="#E2B12F"/>
    <path d="M14 10 h18" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <!-- rider body -->
    <path d="M70 34 q4 -44 34 -52 q20 -4 30 12 l14 24" fill="none" stroke="#2E9C8F" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M78 36 l26 2 l14 34" fill="none" stroke="#2F3E5C" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="112" cy="-40" r="16" fill="#8A5A3C"/>
    <path d="M94 -44 a18 18 0 0 1 36 0 v4 h-36 z" fill="#FF8F66"/>
    <rect x="92" y="-46" width="40" height="7" rx="3.5" fill="#E2754F"/>
  </g>
  <!-- customer with phone and bag -->
  <g transform="translate(640 250)">
    <ellipse cx="34" cy="186" rx="50" ry="8" fill="#D9BF96"/>
    <path d="M14 180 v-60 M54 180 v-60" stroke="#2F3E5C" stroke-width="16" stroke-linecap="round"/>
    <path d="M6 128 q0 -60 28 -66 q28 6 28 66 z" fill="#5B6DC9"/>
    <circle cx="34" cy="40" r="20" fill="#6B4430"/>
    <path d="M14 36 q20 -30 40 0 q-4 -24 -20 -24 q-16 0 -20 24 z" fill="#2A1F1A"/>
    <!-- arm and phone -->
    <path d="M58 82 q22 10 24 -14" fill="none" stroke="#6B4430" stroke-width="10" stroke-linecap="round"/>
    <rect x="72" y="40" width="26" height="44" rx="5" fill="#2F2F2F"/>
    <rect x="75" y="45" width="20" height="32" rx="2" fill="#FFB596"/>
    <path d="M80 58 l4 4 l8 -9" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- shopping bag -->
    <path d="M10 84 q-14 8 -16 20" fill="none" stroke="#6B4430" stroke-width="10" stroke-linecap="round"/>
    <rect x="-30" y="100" width="34" height="38" rx="5" fill="#FF8F66"/>
    <path d="M-22 102 a8 8 0 0 1 18 0" fill="none" stroke="#E2754F" stroke-width="4"/>
  </g>
</svg>
